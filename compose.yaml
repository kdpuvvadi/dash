services:
  dash:
    image: ghcr.io/${GITHUB_OWNER:-kdpuvvadi}/dash:${DASH_TAG:-latest}
    container_name: dash
    # pid:host + SYS_ADMIN: nsenter into the LXC mount ns so /proc/meminfo
    # is the guest view (lxcfs), not the Proxmox node's RAM.
    pid: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    network_mode: host
    # Pass host .env into the process so config/secrets can use ${VAR} expansion.
    env_file:
      - .env
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  caddy:
    image: caddybuilds/caddy-cloudflare:latest
    container_name: dash-caddy
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - dash
    restart: unless-stopped
