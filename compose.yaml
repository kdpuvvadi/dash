services:
  dash:
    image: ghcr.io/${GITHUB_OWNER:-kdpuvvadi}/dash:${DASH_TAG:-latest}
    container_name: dash
    expose:
      - "8080"
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  caddy:
    image: caddybuilds/caddy-cloudflare:latest
    container_name: dash-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - dash
    restart: unless-stopped
