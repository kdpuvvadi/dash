name: ci

on:
  push:
  pull_request:

jobs:
  validate-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Build UI (same as Docker ui stage)
        run: npm install && npm run build
        working-directory: web
      - name: Embed UI for go:embed
        run: |
          rm -rf internal/embedui/dist
          mkdir -p internal/embedui/dist
          cp -a web/dist/. internal/embedui/dist/
      - name: Build
        run: go build -o dash ./cmd/dash
      - name: Validate config and built-in app defs
        run: |
          mkdir -p /tmp/dashcfg
          ./dash init -config /tmp/dashcfg
          ./dash validate -config /tmp/dashcfg
          ./dash apps -config /tmp/dashcfg | grep homeassistant
