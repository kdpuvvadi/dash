name: ci

on:
  push:
  pull_request:

jobs:
  validate-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build
        run: go build -o dash ./cmd/dash
      - name: Validate bundled app defs
        run: |
          mkdir -p /tmp/dashcfg
          ./dash init -config /tmp/dashcfg
          ./dash validate -config /tmp/dashcfg
          ./dash apps -config /tmp/dashcfg

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
